<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Job Market Intelligence: demand, skills, pay and geography from a unified, deduplicated sample of 588k tech job postings." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Job Market Intelligence</title>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("jmi-theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
